version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: deepfake-api
    ports:
      - "8000:8000"
    volumes:
      - ./results/models:/app/results/models:ro
    environment:
      - MODEL_PATH=/app/results/models/resnet18_final_best.pth
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepfake-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  mlflow:
    image: python:3.10-slim
    container_name: deepfake-mlflow
    working_dir: /mlflow
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install mlflow &&
               mlflow ui --backend-store-uri sqlite:///mlflow.db
               --host 0.0.0.0 --port 5000"
    restart: unless-stopped